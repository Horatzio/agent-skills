<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load skill — Horatzio/agent-skills</title>
<style>
  /* Midnight Galaxy (theme-factory): Deep Purple #2b1e3e, Cosmic Blue #4a4e8f,
     Lavender #a490c2, Silver #e6e6fa. Headers FreeSans Bold, body FreeSans. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 3rem 1.5rem;
    color: #e6e6fa;
    background-color: #2b1e3e;
    background-image:
      radial-gradient(1px 1px at 12% 22%, #e6e6fa 100%, transparent 0),
      radial-gradient(1px 1px at 78% 12%, #a490c2 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 34% 68%, #e6e6fa 100%, transparent 0),
      radial-gradient(1px 1px at 62% 84%, #a490c2 100%, transparent 0),
      radial-gradient(1px 1px at 90% 55%, #e6e6fa 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 5% 78%, #a490c2 100%, transparent 0),
      radial-gradient(ellipse at 50% -10%, #4a4e8f 0%, transparent 60%);
    background-repeat: no-repeat;
    font-family: 'FreeSans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  /* Animated star-net background (star-net-background.js): fixed canvas
     behind the content; the body's starfield above stays as the no-WebGL fallback. */
  #star-net { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  body > h1, body > #status, body > #detail { position: relative; z-index: 1; }
  h1 {
    max-width: 46rem;
    margin: 0 auto 1.5rem;
    font-size: 2rem;
    letter-spacing: 0.01em;
  }
  h2 {
    max-width: 46rem;
    margin: 2rem auto 1rem;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
  }
  #status {
    max-width: 46rem;
    margin: 0 auto 1rem;
    padding: 1rem 1.25rem;
    background: rgba(74, 78, 143, 0.35);
    border: 1px solid #4a4e8f;
    border-radius: 12px;
  }
  #detail {
    max-width: 46rem;
    margin: 0 auto;
  }
  #detail p { margin: 0.75rem 0; }
  a { color: #a490c2; }
  a:hover { color: #e6e6fa; }
  strong { color: #ffffff; }
  code {
    padding: 0.1em 0.35em;
    background: rgba(74, 78, 143, 0.55);
    border-radius: 6px;
    font-size: 0.95em;
  }
  ul { padding-left: 1.25rem; }
  li { margin: 0.35rem 0; }
  .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: 0.75rem; margin: 1rem 0; }
  .card { background: rgba(74, 78, 143, 0.35); border: 1px solid #4a4e8f; border-top: 3px solid #4a4e8f; border-radius: 12px; padding: 0.9rem 1rem; aspect-ratio: 1 / 1; display: flex; flex-direction: column; gap: 0.45rem; }
  .card .title { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
  .card .title a { flex: 1; min-width: 0; }
  .card .emoji { font-size: 1.25rem; }
  .card .badge { align-self: flex-start; margin-left: 0; }
  .card a.repo { font-weight: 400; }
  .card.own { border-top-color: #a490c2; }
  .card.skillbook { border-top-color: #d4af37; }
  .card a { font-weight: 700; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .card .repo { display: block; margin-top: auto; font-size: 0.85rem; opacity: 0.8; }
  .card .desc { font-size: 0.9rem; opacity: 0.85; margin: 0.5rem 0 0; }
  .badge { display: inline-block; margin-left: 0.5rem; padding: 0.1em 0.55em; border-radius: 999px; font-size: 0.75rem; font-weight: 700; vertical-align: middle; }
  .badge.own { background: #a490c2; color: #2b1e3e; }
  .badge.ref { background: #4a4e8f; color: #e6e6fa; }
  .badge.book { background: #d4af37; color: #2b1e3e; }
  .legend { font-size: 0.9rem; }
  .legend .badge { margin-left: 0; margin-right: 0.25rem; }
  .back-link { font-weight: 700; text-decoration: none; margin-right: 0.5rem; }
  .skill-doc h1 { font-size: 1.6rem; margin: 1.5rem auto 1rem; }
  .skill-doc h2 { font-size: 1.3rem; }
  .skill-doc h3 { font-size: 1.1rem; }
  .skill-doc pre { padding: 0.75rem 1rem; background: rgba(43, 30, 62, 0.8); border: 1px solid #4a4e8f; border-radius: 8px; overflow-x: auto; }
  .skill-doc pre code { padding: 0; background: none; }
  .skill-doc table { border-collapse: collapse; margin: 1rem 0; }
  .skill-doc th, .skill-doc td { padding: 0.35rem 0.75rem; border: 1px solid #4a4e8f; text-align: left; }
  .skill-doc blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid #a490c2; opacity: 0.9; }
  .skill-doc hr { border: none; border-top: 1px solid #4a4e8f; margin: 1.5rem 0; }
</style>
</head>
<body>
<canvas id="star-net" aria-hidden="true"></canvas>
<h1>Load skill</h1>
<p id="status">Resolving…</p>
<div id="detail"></div>

<!--
  AGENT PROTOCOL — this page is a single-page app (load.html):
  - With no ?s= it lists all skills; with ?s=<name> it renders that skill in place.
  - If you are an AI agent and JavaScript did not run:
    1. Read the "skill" name from this page's URL: ?s=<name> (or ?skill=<name>, or /load/<name>).
    2. Fetch skills.json from this same directory (e.g. https://horatzio.github.io/agent-skills/skills.json).
    3. Look the name up under "skills" (keys are lowercase kebab-case; a local skill wins over a reference on a clash).
    4. Fetch that entry's "raw_url" — it is the skill's SKILL.md. Load its contents as the skill's instructions.
    5. If the name is absent, the skill is not in Horatzio/agent-skills; say so and list the available names from skills.json.
  Skillbooks (curated skill sets for one area) are listed in skillbooks.json in this same directory.
-->

<script src="vendor/marked.min.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var detailEl = document.getElementById('detail');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }

  function nameFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return (params.get('s') || params.get('skill') || '').trim().toLowerCase();
  }

  // skills.json candidates: relative to this page first, then site-root guesses
  var base = window.location.pathname.replace(/[^/]*$/, '');
  var candidates = [base + 'skills.json', 'skills.json', '../skills.json', '/agent-skills/skills.json'];
  var seen = {}, urls = [];
  candidates.forEach(function (u) { if (!seen[u]) { seen[u] = 1; urls.push(u); } });

  var reg = null; // cached registry, fetched once; client-side routing reuses it

  function fetchRegistry(i) {
    if (i >= urls.length) {
      statusEl.textContent = 'Could not load the skill registry (skills.json).';
      return;
    }
    fetch(urls[i]).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (doc) {
      reg = doc;
      render();
    }).catch(function () { fetchRegistry(i + 1); });
  }

  function cardGrid(skills, names) {
    var legend = '<p class="legend"><span class="badge own">Own</span> created in this repo &nbsp;·&nbsp; <span class="badge ref">Referenced</span> from other repos</p>';
    var cards = names.map(function (n) {
      var own = skills[n].type === 'local';
      var emoji = skills[n].emoji ? '<span class="emoji">' + esc(skills[n].emoji) + '</span>' : '';
      return '<article class="card ' + (own ? 'own' : 'ref') + '"><div class="title">' + emoji + '<a href="?s=' + encodeURIComponent(n) + '">' + esc(n) + '</a></div>' +
        '<span class="badge ' + (own ? 'own' : 'ref') + '">' + (own ? 'Own' : 'Referenced') + '</span>' +
        '<a class="repo" href="' + esc(skills[n].source_url) + '">' + esc(skills[n].source_repo) + '</a></article>';
    }).join('');
    return legend + '<div class="skill-grid">' + cards + '</div>';
  }

  // skillbooks.json candidates: same directory guesses as the registry
  var bookUrls = [];
  candidates.forEach(function (u) { bookUrls.push(u.replace(/skills\.json$/, 'skillbooks.json')); });

  function skillbookGrid(books) {
    var names = Object.keys(books).sort();
    if (!names.length) return '';
    var cards = names.map(function (n) {
      var b = books[n];
      var raw = b.description || '';
      if (raw.length > 120) raw = raw.slice(0, 120).replace(/\s+\S*$/, '') + '…';
      var desc = raw ? esc(raw) : '';
      return '<article class="card skillbook"><div class="title"><span class="emoji">📚</span><a href="' + esc(b.url) + '">' + esc(b.title) + '</a></div>' +
        '<span class="badge book">Skillbook</span>' +
        (desc ? '<p class="desc">' + desc + '</p>' : '') +
        '<a class="repo" href="' + esc(b.url) + '">skillbooks/' + esc(n) + '.md</a></article>';
    }).join('');
    return '<h2>Skillbooks</h2><p class="legend"><span class="badge book">Skillbook</span> a curated set of skills for one area, from the skill-scout workflow</p><div class="skill-grid">' + cards + '</div>';
  }

  function fetchSkillbooks(i) {
    if (i >= bookUrls.length) return;
    fetch(bookUrls[i]).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (doc) {
      var html = skillbookGrid(doc.skillbooks || {});
      if (html) detailEl.insertAdjacentHTML('beforeend', html);
    }).catch(function () { fetchSkillbooks(i + 1); });
  }

  function renderSkill(entry, name) {
    statusEl.innerHTML = '<a class="back-link" href="load.html">&larr; All skills</a> ' +
      (entry.emoji ? esc(entry.emoji) + ' ' : '') + '<strong>' + esc(name) + '</strong> (' + esc(entry.type) +
      ', from ' + esc(entry.source_repo) + ') &middot; <a href="' + esc(entry.raw_url) + '">Raw SKILL.md</a> &middot; ' +
      '<a href="' + esc(entry.source_url) + '">View on GitHub</a>';
    detailEl.innerHTML = '<p>Loading skill…</p>';
    fetch(entry.raw_url).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (md) {
      if (typeof marked !== 'undefined' && marked.parse) {
        detailEl.innerHTML = '<div class="skill-doc">' + marked.parse(md) + '</div>';
      } else {
        detailEl.innerHTML = '<pre>' + esc(md) + '</pre>';
      }
    }).catch(function () {
      detailEl.innerHTML = '<p>Could not load the skill from its source. Read it directly: ' +
        '<a href="' + esc(entry.raw_url) + '">Raw SKILL.md</a></p>';
    });
  }

  function render() {
    var skills = (reg && reg.skills) || {};
    var names = Object.keys(skills).sort();
    var name = nameFromUrl();

    if (!name) {
      statusEl.innerHTML = 'No skill specified. Use <code>?s=&lt;skill-name&gt;</code> — available skills and skillbooks:';
      detailEl.innerHTML = cardGrid(skills, names);
      fetchSkillbooks(0);
      return;
    }

    var entry = skills[name];
    if (!entry) {
      statusEl.textContent = 'Skill not found: ' + name;
      detailEl.innerHTML = cardGrid(skills, names);
      fetchSkillbooks(0);
      return;
    }

    renderSkill(entry, name);
  }

  function navigate(name) {
    var url = name ? '?s=' + encodeURIComponent(name) : 'load.html';
    history.pushState(null, '', url);
    window.scrollTo(0, 0);
    render();
  }

  // Client-side routing: skill links and the back link render in place,
  // without a page reload. External links (repos, skillbooks) behave normally.
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (a.classList.contains('back-link')) {
      e.preventDefault();
      navigate(null);
    } else if (href.charAt(0) === '?') {
      var q = new URLSearchParams(href.slice(1));
      var n = (q.get('s') || q.get('skill') || '').trim().toLowerCase();
      if (n) { e.preventDefault(); navigate(n); }
    }
  });

  window.addEventListener('popstate', function () { render(); });

  fetchRegistry(0);
})();
</script>
<script src="vendor/three.min.js"></script>
<script src="brain-data.js"></script>
<script src="star-net-background.js"></script>
</body>
</html>
